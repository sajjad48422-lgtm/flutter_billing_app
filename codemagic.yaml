workflows:
  android-debug:
    name: دپیر - Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.billing_app"
    triggering:
      events: []
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
